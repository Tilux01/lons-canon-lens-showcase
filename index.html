<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LONS · Canon Lens</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #121212;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 60px;
    }

    .app {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      position: relative;
      padding-bottom: 60px;
    }

    /* ---------- BACKGROUND VIGNETTE / DEPTH ---------- */
    .app::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse 800px 600px at 75% 35%, rgba(60, 50, 45, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse 600px 500px at 25% 70%, rgba(30, 25, 25, 0.4) 0%, transparent 70%),
        radial-gradient(ellipse 900px 700px at 60% 80%, rgba(40, 35, 30, 0.2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- HEADER & NAVIGATION ---------- */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 36px 0 24px;
      width: 100%;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #FFFFFF;
      text-transform: uppercase;
      user-select: none;
    }

    .logo .aperture-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      margin: 0 2px;
      position: relative;
    }

    .logo .aperture-icon svg {
      width: 100%;
      height: 100%;
      fill: #FFFFFF;
    }

    /* Center navigation */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-links a {
      color: #808080;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      transition: color 0.25s ease;
      position: relative;
      padding-bottom: 6px;
    }

    .nav-links a:hover {
      color: #FFFFFF;
    }

    .nav-links a.active {
      color: #FFFFFF;
    }

    .nav-links a.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 1.5px;
      background: #FFFFFF;
      border-radius: 2px;
      /* curved underline effect */
      clip-path: ellipse(50% 100% at 50% 0%);
      width: 120%;
    }

    /* Right search icon */
    .search-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }

    .search-icon:hover {
      opacity: 0.7;
    }

    .search-icon svg {
      width: 20px;
      height: 20px;
      stroke: #FFFFFF;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- MAIN CONTENT: ASYMMETRICAL GRID ---------- */
    .main-content {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 40px;
      align-items: start;
      margin-top: 40px;
      min-height: calc(100vh - 200px);
    }

    /* ========== LEFT COLUMN ========== */
    .left-column {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 20px;
    }

    .hero-heading {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      max-width: 400px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 380px;
    }

    .hero-copy p {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: #B3B3B3;
    }

    .hero-copy p .accent {
      color: #C28B5C;
      font-weight: 500;
    }

    /* Carousel Component */
    .carousel-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .carousel-card {
      background: #1A1A1A;
      border-radius: 16px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
      cursor: pointer;
      max-width: 420px;
    }

    .carousel-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    /* Lens visual inside carousel */
    .lens-visual {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 35% 35%, #2a4a6a 0%, #1a2a3a 40%, #0a0a0a 80%),
        radial-gradient(circle at 50% 50%, rgba(100, 180, 255, 0.15) 0%, transparent 70%);
      box-shadow: 
        inset 0 0 20px rgba(0, 0, 0, 0.8),
        inset 0 0 6px rgba(100, 180, 255, 0.3),
        0 8px 20px rgba(0, 0, 0, 0.6),
        0 0 0 3px #1a1a1a,
        0 0 0 4px #333;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .lens-visual::before {
      content: "";
      position: absolute;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 140, 220, 0.25) 0%, transparent 70%);
      filter: blur(4px);
    }

    .lens-visual::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(150, 200, 255, 0.4) 0%, transparent 80%);
      top: 28%;
      left: 28%;
      filter: blur(2px);
    }

    .lens-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lens-info .lens-model {
      font-size: 13px;
      font-weight: 500;
      color: #B3B3B3;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .lens-info .lens-spec {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .lens-info .lens-spec-sub {
      font-size: 14px;
      font-weight: 400;
      color: #808080;
      letter-spacing: 0.5px;
    }

    /* Pagination dots */
    .pagination-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      padding-left: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333333;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot.active {
      width: 28px;
      border-radius: 9999px;
      background: #FFFFFF;
    }

    /* ========== RIGHT COLUMN ========== */
    .right-column {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 600px;
    }

    /* Camera object */
    .camera-object {
      position: absolute;
      top: 8%;
      right: 8%;
      width: 320px;
      height: auto;
      z-index: 4;
      filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.8));
      animation: floatCamera 7s ease-in-out infinite;
    }

    .camera-object img {
      width: 100%;
      height: auto;
      object-fit: contain;
      transform: rotate(-8deg);
    }

    /* Standalone lens object */
    .lens-object {
      position: absolute;
      bottom: 12%;
      left: 5%;
      width: 200px;
      height: auto;
      z-index: 4;
      filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.8));
      animation: floatLens 6s ease-in-out infinite;
    }

    .lens-object img {
      width: 100%;
      height: auto;
      object-fit: contain;
      transform: rotate(15deg);
    }

    @keyframes floatCamera {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    @keyframes floatLens {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* ---------- TECHNICAL CALLOUTS ---------- */
    .callout {
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    /* Top callout: camera lens */
    .callout-top {
      top: 18%;
      left: 2%;
    }

    .callout-top .callout-line {
      width: 140px;
      height: 1px;
      background: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
      position: relative;
    }

    .callout-top .callout-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    .callout-top .callout-line::after {
      content: "";
      position: absolute;
      right: -4px;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    /* Bottom callout: standalone lens */
    .callout-bottom {
      bottom: 22%;
      right: 5%;
      flex-direction: row-reverse;
    }

    .callout-bottom .callout-line {
      width: 100px;
      height: 1px;
      background: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
      position: relative;
    }

    .callout-bottom .callout-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    .callout-bottom .callout-line::after {
      content: "";
      position: absolute;
      right: -4px;
      top: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFFFFF;
    }

    .callout-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.5px;
      color: #B3B3B3;
      text-transform: uppercase;
    }

    .callout-text .callout-title {
      font-weight: 600;
      color: #FFFFFF;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .callout-text .callout-spec {
      color: #808080;
    }

    .callout-text .callout-spec.highlight {
      color: #C28B5C;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1100px) {
      .main-content {
        grid-template-columns: 1fr;
        gap: 60px;
      }

      .left-column {
        padding-top: 0;
      }

      .hero-heading {
        font-size: 40px;
      }

      .right-column {
        min-height: 500px;
      }

      .camera-object {
        width: 260px;
        top: 5%;
        right: 10%;
      }

      .lens-object {
        width: 160px;
        bottom: 8%;
        left: 10%;
      }

      .callout-top {
        top: 10%;
        left: 0;
      }

      .callout-bottom {
        bottom: 12%;
        right: 0;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 0 24px;
      }

      header {
        flex-wrap: wrap;
        gap: 16px;
        padding: 24px 0 16px;
      }

      .nav-links {
        gap: 20px;
        order: 3;
        width: 100%;
        justify-content: center;
      }

      .nav-links a {
        font-size: 13px;
      }

      .hero-heading {
        font-size: 34px;
      }

      .carousel-card {
        padding: 20px;
        gap: 20px;
        max-width: 100%;
      }

      .lens-visual {
        width: 80px;
        height: 80px;
      }

      .lens-info .lens-spec {
        font-size: 22px;
      }

      .right-column {
        min-height: 400px;
      }

      .camera-object {
        width: 200px;
      }

      .lens-object {
        width: 130px;
      }

      .callout {
        display: none;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0 16px;
      }

      .logo {
        font-size: 20px;
        letter-spacing: 3px;
      }

      .logo .aperture-icon {
        width: 20px;
        height: 20px;
      }

      .hero-heading {
        font-size: 28px;
      }

      .carousel-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .right-column {
        min-height: 320px;
      }

      .camera-object {
        width: 160px;
        right: 5%;
      }

      .lens-object {
        width: 100px;
        left: 5%;
      }
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- ========== HEADER ========== -->
    <header>
      <!-- Logo with aperture icon replacing "O" -->
      <div class="logo">
        L
        <span class="aperture-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- 6-blade aperture -->
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" opacity="0.9"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" transform="rotate(60 12 12)" opacity="0.9"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" transform="rotate(120 12 12)" opacity="0.9"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" transform="rotate(180 12 12)" opacity="0.9"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" transform="rotate(240 12 12)" opacity="0.9"/>
            <path d="M12 6l2.5 4.33h-5L12 6z" transform="rotate(300 12 12)" opacity="0.9"/>
          </svg>
        </span>
        N S
      </div>

      <!-- Center navigation -->
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Products</a>
        <a href="#">Gallery</a>
        <a href="#">About Us</a>
      </nav>

      <!-- Right search -->
      <div class="search-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16" y1="16" x2="21" y2="21"/>
        </svg>
      </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-content">

      <!-- LEFT COLUMN -->
      <div class="left-column">
        <h1 class="hero-heading">Canon Lens</h1>

        <div class="hero-copy">
          <p>For sharper shots, more detail and more zoom.</p>
          <p>feel the millions of <span class="accent">colors</span> in your eyes</p>
        </div>

        <!-- Carousel Component -->
        <div class="carousel-section">
          <div class="carousel-card">
            <div class="lens-visual"></div>
            <div class="lens-info">
              <span class="lens-model">77 mm</span>
              <span class="lens-spec">24mm</span>
              <span class="lens-spec-sub">1:1.4 L</span>
            </div>
          </div>

          <!-- Pagination dots -->
          <div class="pagination-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="right-column">

        <!-- Technical Callout: Top (Camera Lens) -->
        <div class="callout callout-top">
          <div class="callout-line"></div>
          <div class="callout-text">
            <span class="callout-title">Canon Lens</span>
            <span class="callout-spec">EF 40mm</span>
            <span class="callout-spec highlight">1:2.8</span>
            <span class="callout-spec">Made in Japan</span>
          </div>
        </div>

        <!-- Technical Callout: Bottom (Standalone Lens) -->
        <div class="callout callout-bottom">
          <div class="callout-line"></div>
          <div class="callout-text">
            <span class="callout-title">Canon Lens</span>
            <span class="callout-spec">EF 50mm</span>
            <span class="callout-spec highlight">1:1.4</span>
            <span class="callout-spec">Made in Japan</span>
          </div>
        </div>

        <!-- Camera Object (Sony Alpha style body with Canon lens) -->
        <div class="camera-object">
          <img 
            src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600&auto=format&fit=crop&q=80" 
            alt="DSLR Camera with Canon Lens"
          >
        </div>

        <!-- Standalone Lens Object (Canon EF 50mm) -->
        <div class="lens-object">
          <img 
            src="https://images.unsplash.com/photo-1617005082133-548c4dd27f35?w=400&auto=format&fit=crop&q=80" 
            alt="Canon EF 50mm Lens"
          >
        </div>

      </div>
    </div>

  </div>

</body>
</html>
